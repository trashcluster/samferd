name = "samferd"
main = "worker.js"
compatibility_date = "2024-01-01"

# Enable persistent invocation logs (viewable in the Cloudflare dashboard or via
# `wrangler tail`) without needing an active tail session.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# The KV namespace backing the shared board. Create it with:
#   wrangler kv namespace create SAMFERD
# then paste the returned id below.
[[kv_namespaces]]
binding = "SAMFERD"
id = "2b9d139147244ee5be8ef9f82e06e0b6"

# Secrets (set with `wrangler secret put`, never in this file):
#   BOT_TOKEN  — the bot's API token (from @BotFather)
#   GROUP_ID   — the group's chat id, e.g. -100123456789
