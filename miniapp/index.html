<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Samferd</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <h1>✈️ Samferd</h1>
  </header>

  <!-- Shown before membership is confirmed -->
  <div id="loading" class="panel">Loading…</div>

  <!-- Shown to non-members -->
  <div id="denied" class="panel hidden">
    <h2>🔒 Members only</h2>
    <p>Samferd is invite-only. You must be a member of our Telegram group to use it.</p>
    <p class="empty">Ask a group admin to invite you.</p>
  </div>

  <!-- Main app -->
  <main id="app" class="hidden">
    <section class="panel" id="board"></section>

    <!-- Collapsible "Add" form, hidden by default so the board dominates -->
    <button id="toggle-add" class="btn">＋ Add flight / car</button>
    <section id="add-form" class="panel form hidden">
      <h2>Add a flight</h2>
      <label>Flight number
        <input id="flight-number" type="text" placeholder="AF1234" autocomplete="off" />
      </label>
      <label>Departure date
        <input id="departure-date" type="date" />
      </label>
      <button id="create-flight" class="btn primary">Create flight</button>

      <h2 class="mt">Offer a car</h2>
      <label>Free seats
        <input id="car-seats" type="number" min="1" max="20" value="3" />
      </label>
      <label>Note (departure point / time)
        <input id="car-note" type="text" placeholder="e.g. city center, 05:00" autocomplete="off" />
      </label>
      <button id="create-car" class="btn primary">Offer car</button>
    </section>

    <!-- Admin (visible only to admins) -->
    <button id="toggle-admin" class="btn admin hidden">⚙️ Admin</button>
    <section id="admin-panel" class="panel form hidden">
      <h2>Admin — manage flights</h2>
      <div id="admin-flight-list" class="admin-list"></div>

      <div id="admin-editor" class="hidden mt">
        <h2>Edit flight</h2>
        <input id="admin-flight-id" type="hidden" />
        <label>Flight number
          <input id="admin-flight-number" type="text" placeholder="AF1234" autocomplete="off" />
        </label>
        <label>Departure date
          <input id="admin-departure-date" type="date" />
        </label>
        <label>Departure city / airport
          <input id="admin-origin" type="text" placeholder="e.g. CDG" autocomplete="off" />
        </label>
        <label>Destination city / airport
          <input id="admin-destination" type="text" placeholder="e.g. OSL" autocomplete="off" />
        </label>
        <label>Departure time (HH:MM)
          <input id="admin-departure-time" type="text" placeholder="13:45" autocomplete="off" />
        </label>
        <button id="admin-save-flight" class="btn primary">Save flight</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
