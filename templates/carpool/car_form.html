{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "My car" %}{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
    <h1>{% translate "Offer a car" %} — {{ event.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">{% translate "Save" %}</button>
        <a class="btn ghost" href="{% url 'events:detail' event.pk %}">{% translate "Cancel" %}</a>
    </form>
</div>
{% endblock %}
